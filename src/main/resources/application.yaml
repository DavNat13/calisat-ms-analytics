spring:
  application:
    name: calisat-ms-analytics

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5438/calisat_analytics}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Cliente Kafka centralizado: KafkaConfig lee estas propiedades. Dos topicos consumidos
  # (interacciones-user y payment-alerts), con consumer groups separados por responsabilidad.
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.califorge.msanalytics.dto
        spring.json.type.mapping: interaccion:com.califorge.msanalytics.dto.InteraccionEvent,alertaFraude:com.califorge.msanalytics.dto.AlertaFraudeEvent
    listener:
      missing-topics-fatal: false
      ack-mode: record

calisat:
  gateway:
    url: https://ho5p58iyu7.execute-api.us-east-1.amazonaws.com
  analytics:
    kafka:
      topic-interacciones: interacciones-user
      topic-alertas: payment-alerts
      group-recomendaciones: analytics-recommendations-group
      group-metricas: analytics-metrics-group
    # Almacen de historial: jpa (por defecto) o perfil "dynamodb" (tabla UserInteractions)
    dynamodb:
      table: ${DYNAMODB_TABLE:UserInteractions}
      region: ${AWS_REGION:us-east-1}
    websocket:
      allowed-origins: ${WS_ALLOWED_ORIGINS:https://ezeh839whh.execute-api.us-east-1.amazonaws.com,http://localhost:5173}
      broadcast-ms: 2000

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  security:
    jwt:
      providers:
        # Microsoft Entra ID (Azure AD) - accesos desde la app web/SPA
        - name: azure
          jwk-set-uri: https://login.microsoftonline.com/e5372bf0-c5e3-4286-887c-79069f209c1f/discovery/v2.0/keys
          issuers:
            - https://login.microsoftonline.com/e5372bf0-c5e3-4286-887c-79069f209c1f/v2.0
          # Azure usa el Application ID URI como "aud"; se admite con y sin prefijo api://
          audiences:
            - d221f0d2-1a7c-4872-ad6c-367a1f0717ec
            - api://d221f0d2-1a7c-4872-ad6c-367a1f0717ec

        # AWS Cognito - accesos desde clientes moviles/terceros
        - name: cognito
          jwk-set-uri: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_UK0Q6EmAQ/.well-known/jwks.json
          issuers:
            - https://cognito-idp.us-east-1.amazonaws.com/us-east-1_UK0Q6EmAQ
          # App Client ID del user pool. En Cognito aparece en "aud" del ID token
          # y en "client_id" del ACCESS token; el backend acepta cualquiera de los dos.
          audiences:
            - 79rbb9f5e2l5nmak9d17ueb2se
          # Rol por defecto obligatorio para tokens de Cognito (ademas de cognito:groups).
          default-role: CLIENTE
